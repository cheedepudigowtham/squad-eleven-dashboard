<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squad Eleven Dashboard</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f1; --surface: #fcfcfb; --surface-2: #efeee9; --line: #dedcd4;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7973;
  --accent: #1f6f43; --series-1: #2a78d6;
  --win: #157a3c; --win-bg: #e3f3e8; --loss: #b8312f; --loss-bg: #fbe7e6; --nr: #5e5d58; --nr-bg: #ecebe6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #34332f;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #929088;
    --accent: #5cc48a; --series-1: #3987e5;
    --win: #6fd394; --win-bg: #183424; --loss: #f08a87; --loss-bg: #3a1d1c; --nr: #b5b3aa; --nr-bg: #2b2b28;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #34332f;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #929088;
  --accent: #5cc48a; --series-1: #3987e5;
  --win: #6fd394; --win-bg: #183424; --loss: #f08a87; --loss-bg: #3a1d1c; --nr: #b5b3aa; --nr-bg: #2b2b28;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
.sub { color: var(--text-2); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); max-width: 100%; }
.banner { background: #fff4d6; color: #5a4300; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
:root[data-theme="dark"] .banner { background: #3a3014; color: #f3dd9c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .banner { background: #3a3014; color: #f3dd9c; } }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--text-2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.form { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 16px; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: transparent; color: var(--text-2);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--text-2); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
th.sorted::after { content: " ▾"; }
tbody tr:hover { background: var(--surface-2); }
.pl { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--muted); cursor: pointer; background: none; border-top: 0; border-left: 0; border-right: 0; font: inherit; padding: 0; }
.chip { display: inline-block; min-width: 26px; text-align: center; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 6px; }
.chip.W { color: var(--win); background: var(--win-bg); } .chip.L { color: var(--loss); background: var(--loss-bg); }
.chip.NR, .chip.T { color: var(--nr); background: var(--nr-bg); }
.muted { color: var(--muted); }
a { color: var(--accent); }
.bars { width: 100%; }
.bars text { fill: var(--text-2); font-size: 12px; }
.bars .v { fill: var(--text); font-weight: 600; }
.bars rect.bar { fill: var(--series-1); }
.bars rect.hit { fill: transparent; }
.bars g:hover rect.bar { opacity: .8; }
#tip { position: fixed; pointer-events: none; background: var(--text); color: var(--surface); padding: 6px 9px; border-radius: 6px;
  font-size: 12px; opacity: 0; transition: opacity .1s; z-index: 10; max-width: 240px; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text);
  width: min(720px, calc(100vw - 32px)); padding: 20px; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.x { font: inherit; font-size: 20px; background: none; border: 0; color: var(--text-2); cursor: pointer; }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.mini div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.mini b { display: block; font-size: 20px; }
.mini small { color: var(--text-2); font-size: 11px; text-transform: uppercase; }
footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
@media (max-width: 760px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .grid2 { grid-template-columns: 1fr; }
  .mini { grid-template-columns: repeat(2, 1fr); }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span id="team">Squad Eleven</span> dashboard</h1>
      <div class="sub" id="updated"></div>
    </div>
    <div class="filters">
      <select id="fLeague" aria-label="League"></select>
      <select id="fSeason" aria-label="Season"></select>
      <select id="fSeries" aria-label="Series"></select>
    </div>
  </header>
  <div id="banner"></div>

  <section class="kpis" id="kpis"></section>

  <div class="grid2">
    <div class="card"><h2>Top run scorers</h2><svg class="bars" id="chRuns"></svg></div>
    <div class="card"><h2>Top wicket takers</h2><svg class="bars" id="chWkts"></svg></div>
  </div>

  <div class="card">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="bat" aria-selected="true">Batting</button>
      <button role="tab" data-t="bowl" aria-selected="false">Bowling</button>
      <button role="tab" data-t="field" aria-selected="false">Fielding</button>
    </div>
    <div class="scroll"><table id="stats"></table></div>
  </div>

  <div class="card">
    <h2>Results</h2>
    <div class="scroll"><table id="results"></table></div>
  </div>

  <footer id="foot"></footer>
</div>

<dialog id="dlg"></dialog>
<div id="tip"></div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const balls = o => Math.trunc(o) * 6 + Math.round((o - Math.trunc(o)) * 10);
const overs = b => `${Math.floor(b / 6)}${b % 6 ? "." + (b % 6) : ""}`;
const fmt = (x, d = 1) => (x == null || !isFinite(x)) ? "–" : x.toFixed(d);
const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const score = s => s ? `${s.r}/${s.w} (${s.o})` : "–";

const all = DATA.matches;
$("#team").textContent = DATA.team;
document.title = `${DATA.team} Dashboard`;
$("#updated").textContent = `Updated ${new Date(DATA.generated).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })} · from CricClubs`;
if (DATA.demo) $("#banner").innerHTML = `<div class="banner">Demo data – the real numbers appear after the first CricClubs update runs.</div>`;
const failed = (DATA.status?.sources || []).filter(s => s.error);
if (failed.length && !DATA.demo) $("#banner").innerHTML = `<div class="banner">Last update couldn't read: ${failed.map(s => esc(s.league)).join(", ")}. Showing the most recent saved data.</div>`;

// ---------- filters ----------
const uniq = a => [...new Set(a.filter(Boolean))];
const seasons = uniq(all.map(m => m.date.slice(0, 4))).sort().reverse();
function opts(sel, list, allLabel, keep) {
  const prev = keep ? sel.value : "";
  sel.innerHTML = `<option value="">${allLabel}</option>` + list.map(v => `<option>${esc(v)}</option>`).join("");
  if (list.includes(prev)) sel.value = prev;
}
opts($("#fLeague"), uniq(all.map(m => m.league)), "All leagues");
opts($("#fSeason"), seasons, "All seasons");
if (seasons.length) $("#fSeason").value = seasons[0];
function refreshSeries() {
  const l = $("#fLeague").value, s = $("#fSeason").value;
  opts($("#fSeries"), uniq(all.filter(m => (!l || m.league === l) && (!s || m.date.startsWith(s))).map(m => m.series)).sort(), "All series", true);
}
refreshSeries();
for (const id of ["#fLeague", "#fSeason"]) $(id).onchange = () => { refreshSeries(); render(); };
$("#fSeries").onchange = render;
const filtered = () => {
  const l = $("#fLeague").value, s = $("#fSeason").value, r = $("#fSeries").value;
  return all.filter(m => (!l || m.league === l) && (!s || m.date.startsWith(s)) && (!r || m.series === r));
};

// ---------- aggregation ----------
function players(ms) {
  const P = {};
  const get = n => P[n] ??= { name: n, m: new Set(), inn: 0, no: 0, runs: 0, bf: 0, hs: 0, hsNo: false, f4: 0, f6: 0, fifty: 0,
    bb: 0, mdn: 0, rc: 0, wk: 0, best: [0, 0], ct: 0, st: 0, ro: 0, log: [] };
  for (const m of [...ms].sort((a, b) => a.date.localeCompare(b.date))) {
    const seen = {};
    for (const b of m.batting) {
      const p = get(b.name); p.m.add(m.id); p.inn++; p.runs += b.r; p.bf += b.b; p.f4 += b.f4; p.f6 += b.f6;
      if (!b.out) p.no++;
      if (b.r > p.hs || (b.r === p.hs && !b.out)) { p.hs = b.r; p.hsNo = !b.out; }
      if (b.r >= 50) p.fifty++;
      (seen[b.name] ??= { m }).bat = b;
    }
    for (const b of m.bowling) {
      const p = get(b.name); p.m.add(m.id); p.bb += balls(b.o); p.mdn += b.m; p.rc += b.r; p.wk += b.w;
      if (b.w > p.best[0] || (b.w === p.best[0] && b.r < p.best[1])) p.best = [b.w, b.r];
      (seen[b.name] ??= { m }).bowl = b;
    }
    for (const f of m.fielding) {
      const p = get(f.name); p.m.add(m.id); p.ct += f.ct; p.st += f.st; p.ro += f.ro;
      (seen[f.name] ??= { m }).field = f;
    }
    for (const [n, e] of Object.entries(seen)) P[n].log.push(e);
  }
  return Object.values(P).map(p => ({ ...p, mat: p.m.size,
    avg: p.inn - p.no ? p.runs / (p.inn - p.no) : null, sr: p.bf ? p.runs / p.bf * 100 : null,
    econ: p.bb ? p.rc / p.bb * 6 : null, bavg: p.wk ? p.rc / p.wk : null, dis: p.ct + p.st + p.ro }));
}

// ---------- KPIs ----------
function kpis(ms) {
  const c = k => ms.filter(m => m.result === k).length;
  const W = c("W"), L = c("L"), decided = W + L;
  const form = [...ms].slice(0, 10).reverse().map(m => `<span class="chip ${m.result}" title="${esc(m.opponent)}">${m.result}</span>`).join("");
  $("#kpis").innerHTML = [
    ["Played", ms.length], ["Won", W], ["Lost", L], ["Win %", decided ? Math.round(W / decided * 100) + "%" : "–"],
  ].map(([k, v]) => `<div class="kpi"><small>${k}</small><b>${v}</b></div>`).join("") +
    `<div class="kpi"><small>Last ${Math.min(10, ms.length)} (old → new)</small><div class="form">${form || "<span class='muted'>–</span>"}</div></div>`;
}

// ---------- horizontal bar chart ----------
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 12, innerWidth - 250) + "px"; tip.style.top = (e.clientY + 12) + "px"; }
function hideTip() { tip.style.opacity = 0; }
function bars(svg, rows, val, tipFn) {
  const W = svg.clientWidth || 480, rowH = 30, labelW = Math.min(170, W * 0.42), valW = 40;
  const H = Math.max(rows.length, 1) * rowH;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  if (!rows.length) { svg.innerHTML = `<text x="0" y="20">No data for this filter</text>`; return; }
  const max = Math.max(...rows.map(val)) || 1, span = W - labelW - valW;
  svg.innerHTML = rows.map((r, i) => {
    const w = Math.max(2, val(r) / max * span), y = i * rowH;
    const name = r.name.length > 22 ? r.name.slice(0, 21) + "…" : r.name;
    return `<g data-i="${i}" style="cursor:pointer"><rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}"/>
      <text x="0" y="${y + 19}">${esc(name)}</text>
      <rect class="bar" x="${labelW}" y="${y + 7}" width="${w}" height="16" rx="4"/>
      <text class="v" x="${labelW + w + 6}" y="${y + 19}">${val(r)}</text></g>`;
  }).join("");
  svg.querySelectorAll("g").forEach(g => {
    const r = rows[g.dataset.i];
    g.onmousemove = e => showTip(e, tipFn(r)); g.onmouseleave = hideTip; g.onclick = () => profile(r.name);
  });
}

// ---------- stats tables ----------
const COLS = {
  bat: [["Player", p => p.name, "name"], ["M", p => p.mat], ["Inn", p => p.inn], ["NO", p => p.no], ["Runs", p => p.runs],
    ["HS", p => p.hs, null, p => p.hs + (p.hsNo ? "*" : "")], ["Avg", p => p.avg, null, p => fmt(p.avg)], ["SR", p => p.sr, null, p => fmt(p.sr)],
    ["4s", p => p.f4], ["6s", p => p.f6], ["50s", p => p.fifty]],
  bowl: [["Player", p => p.name, "name"], ["M", p => p.mat], ["Overs", p => p.bb, null, p => overs(p.bb)], ["Mdn", p => p.mdn], ["Runs", p => p.rc],
    ["Wkts", p => p.wk], ["Best", p => p.best[0] * 1000 - p.best[1], null, p => `${p.best[0]}/${p.best[1]}`],
    ["Econ", p => p.econ == null ? null : -p.econ, null, p => fmt(p.econ, 2)], ["Avg", p => p.bavg == null ? null : -p.bavg, null, p => fmt(p.bavg)]],
  field: [["Player", p => p.name, "name"], ["M", p => p.mat], ["Catches", p => p.ct], ["Stumpings", p => p.st], ["Run outs", p => p.ro], ["Total", p => p.dis]],
};
const DEFAULT_SORT = { bat: 4, bowl: 5, field: 5 };
let tab = "bat", sortCol = DEFAULT_SORT.bat, current = [];
function statsTable() {
  const cols = COLS[tab];
  const keep = { bat: p => p.inn, bowl: p => p.bb, field: p => p.dis }[tab];
  const rows = current.filter(keep).sort((a, b) => {
    const [, f, kind] = cols[sortCol]; const x = f(a), y = f(b);
    if (kind === "name") return x.localeCompare(y);
    return (y ?? -Infinity) - (x ?? -Infinity) || a.name.localeCompare(b.name);
  });
  $("#stats").innerHTML = `<thead><tr>${cols.map((c, i) => `<th data-i="${i}" class="${i === sortCol ? "sorted" : ""}">${c[0]}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(p => `<tr>${cols.map((c, i) => i === 0
      ? `<td><button class="pl" data-n="${esc(p.name)}">${esc(p.name)}</button></td>`
      : `<td>${esc((c[3] || c[1])(p) ?? "–")}</td>`).join("")}</tr>`).join("") ||
      `<tr><td colspan="${cols.length}" class="muted">No data for this filter</td></tr>`}</tbody>`;
  $("#stats").querySelectorAll("th").forEach(th => th.onclick = () => { sortCol = +th.dataset.i; statsTable(); });
  $("#stats").querySelectorAll(".pl").forEach(b => b.onclick = () => profile(b.dataset.n));
}
$("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
  $("#tabs").querySelectorAll("button").forEach(x => x.setAttribute("aria-selected", x === b));
  tab = b.dataset.t; sortCol = DEFAULT_SORT[tab]; statsTable();
});

// ---------- results ----------
function results(ms) {
  $("#results").innerHTML = `<thead><tr><th class="l">Date</th><th class="l">Opponent</th><th class="l">Competition</th><th>Squad Eleven</th><th>Opponent</th><th class="l">Result</th><th></th></tr></thead>
  <tbody>${ms.map(m => `<tr><td class="l">${fmtDate(m.date)}</td><td class="l">${esc(m.opponent)}</td>
    <td class="l muted">${esc(m.series || m.league)}</td><td>${score(m.us)}</td><td>${score(m.them)}</td>
    <td class="l"><span class="chip ${m.result}">${m.result}</span> <span class="muted">${esc(m.margin)}</span></td>
    <td>${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">Scorecard</a>` : ""}</td></tr>`).join("") ||
    `<tr><td colspan="7" class="muted">No matches for this filter</td></tr>`}</tbody>`;
}

// ---------- player profile ----------
function profile(name) {
  const p = current.find(x => x.name === name); if (!p) return;
  const log = [...p.log].reverse();
  const maxR = Math.max(1, ...p.log.map(e => e.bat?.r || 0));
  const W = 640, H = 120, bw = Math.max(4, Math.min(28, (W - 20) / Math.max(p.log.length, 1) - 4));
  const chart = p.inn ? `<svg viewBox="0 0 ${W} ${H + 20}" width="100%" class="bars" role="img" aria-label="Runs per match">
    <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>
    ${p.log.map((e, i) => { const r = e.bat?.r; if (r == null) return ""; const h = Math.max(2, r / maxR * (H - 16));
      const x = 4 + i * (bw + 4);
      return `<g data-tip="${esc(fmtDate(e.m.date) + " v " + e.m.opponent + ": " + r + (e.bat.out ? "" : "*") + " (" + e.bat.b + ")")}">
        <rect class="hit" x="${x - 2}" y="0" width="${bw + 4}" height="${H}"/>
        <rect class="bar" x="${x}" y="${H - h}" width="${bw}" height="${h}" rx="3"/></g>`; }).join("")}
    <text x="0" y="${H + 16}">Runs per innings, oldest → newest</text></svg>` : "";
  $("#dlg").innerHTML = `<div class="dlg-head"><div><h2 style="margin:0">${esc(name)}</h2><div class="sub">${p.mat} matches in this view</div></div>
    <button class="x" aria-label="Close" onclick="dlg.close()">×</button></div>
    <div class="mini">
      <div><small>Runs</small><b>${p.runs}</b></div><div><small>Bat avg / SR</small><b>${fmt(p.avg)} / ${fmt(p.sr, 0)}</b></div>
      <div><small>Wickets</small><b>${p.wk}</b></div><div><small>Economy</small><b>${fmt(p.econ, 2)}</b></div>
    </div>${chart}
    <div class="scroll"><table><thead><tr><th class="l">Date</th><th class="l">Opponent</th><th>Batting</th><th>Bowling</th><th>Fielding</th></tr></thead>
    <tbody>${log.map(e => `<tr><td class="l">${fmtDate(e.m.date)}</td><td class="l">${esc(e.m.opponent)}</td>
      <td>${e.bat ? `${e.bat.r}${e.bat.out ? "" : "*"} (${e.bat.b})` : "–"}</td>
      <td>${e.bowl ? `${e.bowl.w}/${e.bowl.r} (${e.bowl.o})` : "–"}</td>
      <td>${e.field ? [e.field.ct && e.field.ct + " ct", e.field.st && e.field.st + " st", e.field.ro && e.field.ro + " ro"].filter(Boolean).join(", ") : "–"}</td></tr>`).join("")}</tbody></table></div>`;
  $("#dlg").querySelectorAll("g[data-tip]").forEach(g => { g.onmousemove = e => showTip(e, g.dataset.tip); g.onmouseleave = hideTip; });
  $("#dlg").showModal();
}
const dlg = $("#dlg");
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

// ---------- render ----------
function render() {
  const ms = filtered();
  current = players(ms);
  kpis(ms);
  bars($("#chRuns"), [...current].filter(p => p.runs).sort((a, b) => b.runs - a.runs).slice(0, 8), p => p.runs,
    p => `<b>${esc(p.name)}</b><br>${p.runs} runs · ${p.inn} inns · avg ${fmt(p.avg)} · SR ${fmt(p.sr, 0)}`);
  bars($("#chWkts"), [...current].filter(p => p.wk).sort((a, b) => b.wk - a.wk || (a.econ ?? 99) - (b.econ ?? 99)).slice(0, 8), p => p.wk,
    p => `<b>${esc(p.name)}</b><br>${p.wk} wkts · ${overs(p.bb)} ov · econ ${fmt(p.econ, 2)}`);
  statsTable();
  results(ms);
  $("#foot").textContent = `${all.length} matches loaded across ${uniq(all.map(m => m.league)).length} leagues. Click any player for their match-by-match record.`;
}
render();
addEventListener("resize", () => { clearTimeout(window._rt); window._rt = setTimeout(render, 150); });
</script>
</body>
</html>
