name: Update dashboard

on:
  push:
    paths:
      - "squad-data.json"   # runs when you upload a new squad-data.json
      - "config.json"
      - "template.html"
      - "build.py"
      - "bookmarklet.js"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install beautifulsoup4 lxml
      - name: Import uploaded data and build the page
        run: |
          python import_bundle.py
          python build.py
      - name: Save imported scorecards
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Import CricClubs data"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
